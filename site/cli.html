    <h1>CLI reference</h1>
    <p class="lead">Generated from the binary's own <code>--help</code> output. Re-run <code>python3 scripts/pages-build.py</code> after CLI changes. The <a href="./docs.html">docs page</a> explains the pipeline and views.</p>
    <figure>
      <figcaption id="cli-0"><code>saniwalens --help</code></figcaption>
      <pre role="region" aria-labelledby="cli-0" tabindex="0"><code>See where your coding-agent time and tokens go, and which config to fix.
Start with `saniwalens doctor`; every report explains itself and names the
follow-up command.

Usage: saniwalens [OPTIONS] &lt;COMMAND&gt;

Commands:
  analyze    Read your session logs and config into the local store. Runs automatically before every report — call it directly only to refresh without reading anything
  usage      How often each skill ran and what it cost — per skill, or over time with --by
  trend      How usage moved: each kind of event, each skill, and the session and subagent totals this window against the equal-length window right before it (default 7d vs the 7d before)
  models     Where the tokens went, by model: main-thread usage and subagent runs grouped per model, costliest first
  sessions   Every session: what it spent, how long it ran, and how often tool calls kept failing inside it — costliest first
  inventory  Everything installed in your config (skills, rules, agents, MCP servers, CLAUDE.md), what it weighs, and whether it was ever used
  waste      Cleanup opportunities: config that is never used, loaded every session while heavy, or rarely worth its cost — ranked by what removing it actually saves
  overhead   What every session pays in context before any work starts, and how much of that comes from your own config files vs the harness itself
  prompts    How you steer Claude: the mix of instructing, steering (&quot;go ahead&quot;), correcting (&quot;no, instead…&quot;), and questioning prompts — and what that mix suggests changing
  failures   Tool calls that kept failing the same way — recurring failures that waste turns and tokens, each with a suggested fix
  stuck      Files Claude kept re-editing in rapid bursts — where it got stuck retrying instead of making progress
  doctor     The health check — what to fix first, what your sessions cost, and what is fine as-is. Start here
  sql        Ask anything the fixed reports don&#x27;t cover: run a read-only SQL query against the analyzed store (as an argument, or piped via stdin). `SELECT sql FROM sqlite_master` shows the schema
  optimize   Act on the findings: opens an advisor session pre-loaded with the full analysis, which investigates each problem and proposes concrete config fixes (interactively under Claude Code, headless under opencode)
  tui        Step-by-step guide to the typical patterns (doctor / waste / failures). Needs an interactive terminal; without one it refuses instead of hanging
  cleanup    List or prune the `--apply` handoff&#x27;s saved plans and backups. Needs no store: it only reads (and, with `--keep`, deletes) under $XDG_STATE_HOME/saniwalens/plans/ and .../backups/
  help       Print this message or the help of the given subcommand(s)

Options:
      --harness &lt;HARNESS&gt;    Which agent harness to analyze: claude (default) | opencode | kilocode. Global so every command resolves its store and input roots through it. See `docs/specs/harness.md`
      --profile &lt;PROFILE&gt;    Named preset from the config file to run under. Global so every command resolves through it; an explicit --harness or --db still wins over whatever the profile sets. See `docs/specs/cli.md`
      --language &lt;LANGUAGE&gt;  Advisor output language: en (the default) | ja. Global so every command resolves it through the same flag-beats-file order; only `optimize` renders it into a prompt today. See `docs/specs/cli.md`
  -h, --help                 Print help
  -V, --version              Print version</code></pre>
    </figure>

      --harness &lt;HARNESS&gt;    Which agent harness to analyze: claude (default) | opencode | kilocode. Global so every command resolves its store and input roots through it. See `docs/specs/harness.md`
      --scope &lt;SCOPE&gt;        Show one config layer only: global (~/.claude) | project (all projects&#x27; own config) | project:&lt;slug&gt; (one project&#x27;s)
